name: Validate stories

on:
  pull_request:
  push:
    paths:
      - stories.js
      - scripts/story-bank.js
      - scripts/croatian-checks.js
      - scripts/update-weekly-stories.js
      - scripts/validate-stories.js
      - learn-gate.js
      - scripts/test-quiz-gate.js

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/update-weekly-stories.js
      - run: node scripts/validate-stories.js --bank
      - run: node scripts/test-quiz-gate.js

<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Vrijeme za priču</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#12141c" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player">
    <div class="player-top">
      <a class="back-link" href="index.html">&larr; Natrag</a>
      <span class="progress" id="progress"></span>
    </div>

    <div class="line-area" id="lineArea">
      <div class="line-hr" id="lineHr"></div>
      <div class="line-en" id="lineEn"></div>
    </div>

    <div class="controls" id="controls">
      <button id="prevBtn" aria-label="Prethodno">&larr;</button>
      <button id="replayBtn" class="replay">&#128257; Ponovi</button>
      <button id="nextBtn" aria-label="Sljedeće">&rarr;</button>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script src="stories.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const story = STORIES.find((s) => s.id === params.get("story")) || STORIES[0];

    let idx = 0;
    const audio = document.getElementById("audio");
    const lineHr = document.getElementById("lineHr");
    const lineEn = document.getElementById("lineEn");
    const progress = document.getElementById("progress");
    const replayBtn = document.getElementById("replayBtn");
    const playerEl = document.querySelector(".player");

    function attemptPlay() {
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          replayBtn.textContent = "🔁 Ponovi";
        }).catch(() => {
          replayBtn.textContent = "▶ Reproduciraj";
        });
      } else {
        replayBtn.textContent = "🔁 Ponovi";
      }
    }

    function render() {
      const line = story.lines[idx];
      lineHr.textContent = line.hr;
      lineEn.textContent = line.en;
      progress.textContent = `${idx + 1} / ${story.lines.length}`;
      audio.src = line.audio;
      replayBtn.textContent = "🔁 Ponovi";
      attemptPlay();
    }

    function next() {
      if (idx < story.lines.length - 1) {
        idx++;
        render();
      } else {
        showDone();
      }
    }

    function prev() {
      if (idx > 0) {
        idx--;
        render();
      }
    }

    function showDone() {
      playerEl.innerHTML = `
        <div class="done">
          <div class="line-hr">Kraj priče</div>
          <div class="line-en">The end</div>
          <p><a href="index.html">&larr; Natrag na priče</a></p>
        </div>
      `;
    }

    audio.addEventListener("ended", () => {
      setTimeout(next, 700);
    });

    document.getElementById("prevBtn").addEventListener("click", prev);
    document.getElementById("nextBtn").addEventListener("click", next);
    replayBtn.addEventListener("click", attemptPlay);

    render();

    // Keep the screen awake for the duration of the story.
    let wakeLock = null;
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) {
        // ignore - not critical to playback
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
  </script>
</body>
</html>

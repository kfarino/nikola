<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Vrijeme za priču</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="oklch(16% 0.012 55)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player">
    <div class="player-top">
      <a class="back-link" href="index.html">&lsaquo; Natrag</a>
      <div class="speed-toggle-group">
        <div id="normalOption" class="speed-option active">Normalno</div>
        <div id="slowOption" class="speed-option">Polako</div>
      </div>
    </div>

    <div class="line-area" id="lineArea">
      <div class="line-hr" id="lineHr"></div>
      <div class="line-en" id="lineEn"></div>
    </div>

    <div class="controls" id="controls">
      <button id="prevBtn" class="icon-btn" aria-label="Prethodno">&lsaquo;</button>
      <button id="replayBtn" class="replay">&#128257; Ponovi</button>
      <button id="nextBtn" class="icon-btn" aria-label="Sljedeće">&rsaquo;</button>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script src="stories.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const story = STORIES.find((s) => s.id === params.get("story")) || STORIES[0];

    let idx = 0;
    let slowMode = false;
    let playingHalf = "a"; // which half is loaded when slowMode is on: "a" or "b"
    let pendingTimer = null; // the scheduled auto-advance/half-flip timeout, if any
    const SLOW_PAUSE_MULT = 1; // pause after each half, in slow mode
    const NORMAL_PAUSE_MULT = 1.5; // pause after the full line, in normal mode
    const audio = document.getElementById("audio");
    const lineHr = document.getElementById("lineHr");
    const lineEn = document.getElementById("lineEn");
    const replayBtn = document.getElementById("replayBtn");
    const normalOption = document.getElementById("normalOption");
    const slowOption = document.getElementById("slowOption");
    const playerEl = document.querySelector(".player");

    function attemptPlay() {
      clearTimeout(pendingTimer);
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          replayBtn.textContent = "🔁 Ponovi";
        }).catch(() => {
          replayBtn.textContent = "▶ Reproduciraj";
        });
      } else {
        replayBtn.textContent = "🔁 Ponovi";
      }
    }

    function playCurrent() {
      const line = story.lines[idx];
      audio.src = slowMode ? (playingHalf === "a" ? line.audioSlowA : line.audioSlowB) : line.audio;
      replayBtn.textContent = "🔁 Ponovi";
      attemptPlay();
    }

    function render() {
      const line = story.lines[idx];
      lineHr.textContent = line.hr;
      lineEn.textContent = line.en;
      playingHalf = "a";
      playCurrent();
    }

    function next() {
      if (idx < story.lines.length - 1) {
        idx++;
        render();
      } else {
        showDone();
      }
    }

    function prev() {
      if (idx > 0) {
        idx--;
        render();
      }
    }

    function showDone() {
      playerEl.innerHTML = `
        <div class="done">
          <div class="line-hr">Kraj priče</div>
          <div class="line-en">The end</div>
        </div>
      `;
      setTimeout(() => {
        location.href = "index.html";
      }, 2500);
    }

    audio.addEventListener("ended", () => {
      const spokenSeconds = audio.duration || 2;

      if (slowMode && playingHalf === "a") {
        const pauseMs = spokenSeconds * SLOW_PAUSE_MULT * 1000;
        pendingTimer = setTimeout(() => {
          playingHalf = "b";
          playCurrent();
        }, pauseMs);
        return;
      }

      const pauseMultiplier = slowMode ? SLOW_PAUSE_MULT : NORMAL_PAUSE_MULT;
      const pauseMs = spokenSeconds * pauseMultiplier * 1000;
      pendingTimer = setTimeout(next, pauseMs);
    });

    document.getElementById("prevBtn").addEventListener("click", prev);
    document.getElementById("nextBtn").addEventListener("click", next);
    replayBtn.addEventListener("click", attemptPlay);

    function setSlowMode(slow) {
      if (slow === slowMode) return;
      slowMode = slow;
      normalOption.classList.toggle("active", !slowMode);
      slowOption.classList.toggle("active", slowMode);
      render();
    }
    normalOption.addEventListener("click", () => setSlowMode(false));
    slowOption.addEventListener("click", () => setSlowMode(true));

    render();

    // Keep the screen awake for the duration of the story.
    let wakeLock = null;
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) {
        // ignore - not critical to playback
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
  </script>
</body>
</html>

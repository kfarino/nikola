<body>
  <div class="home" id="homeScreen">

        <button type="button" id="songsTabOption" class="home-nav-tab">🎸 Pjesme</button>

    <p class="learn-hint" id="learnHint">Slušaj. U pauzi ponovi.</p>
    <div class="story-list" id="storyList"></div>

    <div class="done" id="doneScreen" hidden>

  <div class="player" id="songPreviewScreen" hidden>

  <div class="player" id="songPlayScreen" hidden>

      <div class="karaoke-top-controls">
        <button type="button" id="songPauseBtn" class="icon-btn" aria-label="Pauza">&#9208;</button>
        <div class="karaoke-speed">
          <button type="button" id="speedDownBtn" class="icon-btn" aria-label="Sporije">&minus;</button>
          <span id="karaokeSpeedLabel" class="karaoke-speed-label" aria-live="polite">Brzina 1</span>

    <div class="chord-widget" id="chordWidget"></div>
    <div class="karaoke-viewport" id="karaokeViewport">
      <div class="karaoke-track" id="karaokeTrack"></div>
    </div>
    <div class="controls" id="songControls">
      <button id="songPrevBtn" class="icon-btn" aria-label="Prethodni dio">&lsaquo;</button>
      <button id="songNextBtn" class="icon-btn" aria-label="Sljedeći dio">&rsaquo;</button>

  <div class="player" id="quizScreen" hidden>

  <div class="player" id="reciScreen" hidden>
    <div class="player-top">
      <a class="back-link" href="index.html" id="reciBackLink">&lsaquo; Natrag</a>
      <div id="reciProgress" class="quiz-progress"></div>
    </div>
    <div class="reci-body">
      <div class="quiz-prompt-label" id="reciLabel">Reci na hrvatskom</div>
      <div class="line-en" id="reciEn"></div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script src="stories.js"></script>
  <script src="songs.js"></script>
  <script src="books.js"></script>
  <script src="learn-gate.js"></script>
  <script src="quiz-typing.js"></script>
  <script>
    const homeScreen = document.getElementById("homeScreen");
    const playerScreen = document.getElementById("playerScreen");
    const storyList = document.getElementById("storyList");
    const playerTop = document.getElementById("playerTop");
    const lineArea = document.getElementById("lineArea");
    const controls = document.getElementById("controls");
    const doneScreen = document.getElementById("doneScreen");
    const backLink = document.getElementById("backLink");
    const audio = document.getElementById("audio");
    const lineHr = document.getElementById("lineHr");
    const lineEn = document.getElementById("lineEn");
    const replayBtn = document.getElementById("replayBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const songList = document.getElementById("songList");
    const bookList = document.getElementById("bookList");
    const storiesTabOption = document.getElementById("storiesTabOption");
    const songsTabOption = document.getElementById("songsTabOption");
    const booksTabOption = document.getElementById("booksTabOption");
    const quizTabOption = document.getElementById("quizTabOption");
    const quizList = document.getElementById("quizList");
    const learnHint = document.getElementById("learnHint");
    const quizScreen = document.getElementById("quizScreen");
    const quizBackLink = document.getElementById("quizBackLink");
    const quizProgress = document.getElementById("quizProgress");
    const quizPrompt = document.getElementById("quizPrompt");
    const quizChoices = document.getElementById("quizChoices");
    const quizStatus = document.getElementById("quizStatus");
    const quizPromptLabel = document.querySelector("#quizScreen .quiz-prompt-label");
    const doneQuizBtn = document.getElementById("doneQuizBtn");
    const songPreviewScreen = document.getElementById("songPreviewScreen");
    const songPreviewTitle = document.getElementById("songPreviewTitle");
    const songPreviewMeta = document.getElementById("songPreviewMeta");
    const songPreviewSections = document.getElementById("songPreviewSections");
    const songPreviewBackLink = document.getElementById("songPreviewBackLink");
    const songPlayBtn = document.getElementById("songPlayBtn");
    const songPlayScreen = document.getElementById("songPlayScreen");
    const chordWidget = document.getElementById("chordWidget");
    const karaokeViewport = document.getElementById("karaokeViewport");
    const karaokeTrack = document.getElementById("karaokeTrack");
    const songPauseBtn = document.getElementById("songPauseBtn");
    const songPlayBackLink = document.getElementById("songPlayBackLink");

    let story = null; // the current STORIES or BOOKS entry being read - same shape either way
    let contentKind = null; // "story" | "book" - which list `story` came from
    let song = null;
    let idx = 0;
    let pendingTimer = null; // the scheduled auto-advance/return-home timeout, if any
    let pendingAction = null; // what pendingTimer will do when it fires - resumed immediately on unpause
    let isPaused = false;
    let pausedState = null; // "playing" | "waiting" - what we were doing when paused
    // After each 5–6 word chunk, wait twice the clip so the parent has room
    // to think and then say it back, instead of being cut off mid-echo.
    const PHRASE_PAUSE_MULT = 2;
    const LEARN_KEY = "nikola-learn";
    const QUIZ_PASS = 4;
    const QUIZ_N = 5;
    const QUIZ_DECOYS = 2; // extra wrong words mixed into each question's tiles
    const previousStories = typeof PREVIOUS_STORIES !== "undefined" && PREVIOUS_STORIES ? PREVIOUS_STORIES : [];
    const previousDate = typeof PREVIOUS_DATE !== "undefined" ? PREVIOUS_DATE : null;

    let quizStory = null;
    let quizItems = [];
    let quizIdx = 0;
    let quizScore = 0;
    let quizLocked = false;
    let quizPlaced = []; // tiles tapped into the answer, in order
    let quizBank = []; // tiles still waiting to be used
    let currentSection = "stories";

    function canTakeQuiz(s) {
      const learn = loadLearn();
      const key = slotKey(s.id, storyWeek(s));
      return !!(learn.completed[key] || learn.passed[key]);
    }

    function loadLearn() {
      try {
        const data = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}");
        return { completed: data.completed || {}, passed: data.passed || {} };
      } catch {
        return { completed: {}, passed: {} };
      }
    }
    function saveLearn(data) {
      localStorage.setItem(LEARN_KEY, JSON.stringify(data));
    }
    function storyWeek(s) {
      return s.weekDate || STORY_DATE;
    }
    function displayedStories() {
      return displayedStoriesFor(STORIES, previousStories, previousDate, loadLearn().passed);
    }
    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }
    // A line's comparable words: no trailing sentence punctuation, since a tile
    // ending in "." would give away which word goes last.
    function lineWords(hr) {
      return hr.replace(/[.!?]+$/, "").split(/\s+/).filter(Boolean);
    }

    // One tile question: the line's own words, shuffled, plus a couple of decoy
    // words drawn from elsewhere in the same story - so a wrong tile is a word
    // actually heard this week, not obvious filler.
    function tileItem(s, line) {
      const words = lineWords(line.hr);
      const own = new Set(words.map((w) => w.toLowerCase()));
      const pool = shuffle(
        s.lines
          .filter((l) => l.hr !== line.hr)
          .flatMap((l) => lineWords(l.hr))
          .filter((w) => !own.has(w.toLowerCase()))
      );
      const decoys = [];
      for (const w of pool) {
        if (decoys.length >= QUIZ_DECOYS) break;
        if (!decoys.some((d) => d.toLowerCase() === w.toLowerCase())) decoys.push(w);
      }
      // Tiles carry an id because a sentence can legitimately repeat a word
      // ("se", "za"), and tapping one must move that tile, not its twin.
      const tiles = shuffle(words.concat(decoys).map((text, i) => ({ id: i, text })));
      return { type: "tiles", en: line.en, correct: words.join(" "), tiles };
    }

    // Vocabulary and verbs first: type the story's focus word from its English,
    // and type the focus verb's form into a line with it blanked out. Both come
    // from the hand-authored focusHr/focusEn, so no gloss is ever invented.
    // Word tiles fill the rest.
    function buildQuiz(s) {
      const items = [];
      if (s.focusHr && s.focusEn) {
        items.push({ type: "vocab", en: s.focusEn, correct: s.focusHr });
      }
      const forms = focusForms(s);
      if (forms.length) {
        const pick = shuffle(forms)[0];
        items.push({
          type: "cloze",
          en: clozeText(pick.line.hr, pick.form),
          hint: `${pick.line.en} (${s.focusHr.split(/\s+/)[0]})`,
          correct: pick.form,
        });
      }
      const tiles = shuffle(s.lines)
        .slice(0, QUIZ_N - items.length)
        .map((line) => tileItem(s, line));
      return shuffle(items.concat(tiles));
    }

    function markCompleted(s) {
      const learn = loadLearn();
      learn.completed[slotKey(s.id, storyWeek(s))] = true;
      saveLearn(learn);
    }
    function markPassed(s) {
      const learn = loadLearn();
      learn.passed[slotKey(s.id, storyWeek(s))] = true;
      saveLearn(learn);
    }

    let songPaused = false;
    let karaokeLineOffsets = []; // [{ el, top, sectionIdx }] per rendered lyric line, in play order
    let karaokeMaxScroll = 0;
    // Auto-scroll's own position, in float CSS pixels. It deliberately does
    // NOT live in karaokeViewport.scrollTop: the browser snaps scrollTop to
    // whole device pixels, so at the rates this screen actually uses (Brzina 1
    // = 5px/sec = 0.08px per frame) every increment was rounded away on
    // readback and the lyrics never moved at all. scrollTop stays the render
    // target, and stays authoritative while a finger is dragging; this is what
    // auto-scroll accumulates into between frames.
    let karaokePos = 0;
    let karaokeRafId = null;
    let karaokeLastFrameTime = 0;
    let karaokeSpeed = 5; // px/sec - hands-free auto-scroll rate (default = slowest)
    const KARAOKE_MIN_SPEED = 5;
    const KARAOKE_MAX_SPEED = 80;
    const KARAOKE_SPEED_STEP = 5;
    const karaokeSpeedLabel = document.getElementById("karaokeSpeedLabel");
    // True while a finger/mouse is actively scrolling the lyric pane — auto-scroll
    // yields so it doesn't fight the gesture (including iOS momentum), then resumes.
    let karaokeDragging = false;
    let karaokeResumeTimer = null;

    function updateKaraokeSpeedLabel() {
      const level = Math.round(karaokeSpeed / KARAOKE_SPEED_STEP);
      karaokeSpeedLabel.textContent = `Brzina ${level}`;
    }

    function setSongPaused(paused) {
      songPaused = paused;
      songPauseBtn.textContent = paused ? "▶" : "⏸";
      if (paused) {
        stopKaraokeScroll();
      } else {
        startKaraokeScroll();
      }
    }

    function karaokeScrollPos() {
      return karaokeViewport.scrollTop;
    }

    function setKaraokeScrollPos(pos) {
      const max = Math.max(0, karaokeMaxScroll);
      karaokePos = Math.max(0, Math.min(max, pos));
      karaokeViewport.scrollTop = karaokePos;
      updateChordWidget();
    }

    function measureKaraokeScroll() {
      karaokeMaxScroll = Math.max(0, karaokeViewport.scrollHeight - karaokeViewport.clientHeight);
      karaokeLineOffsets.forEach((entry) => {
        entry.top = entry.el.offsetTop;
      });
      karaokePos = Math.min(karaokePos, karaokeMaxScroll);
    }

    function beginKaraokeDrag() {
      clearTimeout(karaokeResumeTimer);
      karaokeDragging = true;
    }

    function scheduleKaraokeResume() {
      clearTimeout(karaokeResumeTimer);
      // Wait out inertial scrolling before auto-advance takes over again.
      karaokeResumeTimer = setTimeout(() => {
        karaokeDragging = false;
        karaokeLastFrameTime = 0;
        // The gesture moved scrollTop behind the accumulator's back; resume
        // from where it landed instead of snapping back to the old position.
        karaokePos = karaokeViewport.scrollTop;
        updateChordWidget();
      }, 180);
    }

    // Shared by every screen transition so exactly one of the 4 top-level
    // screens is ever visible, and any pending Story/Song timer, running
    // karaoke scroll, or playing audio from the screen we're leaving is stopped.
    function showScreen(el) {
      clearTimeout(pendingTimer);
      stopReci();
      stopKaraokeScroll();
      audio.pause();
      [homeScreen, playerScreen, songPreviewScreen, songPlayScreen, quizScreen, reciScreen].forEach((s) => {
        s.hidden = s !== el;
      });
    }

    function renderHome() {
      storyList.innerHTML = "";
      displayedStories().forEach((s) => {
        const learn = loadLearn();
        const key = slotKey(s.id, storyWeek(s));
        const held = previousDate && s.weekDate === previousDate;
        const metaBits = [];
        if (s.focusHr) metaBits.push(s.focusHr);
        metaBits.push(`${s.lines.length} fraza`);
        if (learn.passed[key]) metaBits.push("kviz položen");
        else if (held) metaBits.push("čeka kviz");
        const a = document.createElement("a");
        a.className = "story-card";
        a.href = `index.html?story=${s.id}`;
        a.innerHTML = `
          <div class="icon">${s.emoji}</div>
          <div class="text">
            <div class="hr">${s.titleHr}</div>
            <div class="en">${s.titleEn}</div>
            <div class="meta">${metaBits.join(" · ")}</div>
          </div>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState({ story: s.id }, "", `index.html?story=${s.id}`);
          selectStory(s.id);
        });
        storyList.appendChild(a);
      });
    }

    function renderQuizList() {
      quizList.innerHTML = "";
      displayedStories().forEach((s) => {
        const learn = loadLearn();
        const key = slotKey(s.id, storyWeek(s));
        const passed = !!learn.passed[key];
        const completed = !!learn.completed[key];
        const locked = !canTakeQuiz(s);
        const a = document.createElement(locked ? "button" : "a");
        a.className = locked ? "story-card locked" : "story-card";
        if (locked) {
          a.type = "button";
          a.setAttribute("aria-disabled", "true");
        } else {
          a.href = `index.html?quiz=${s.id}`;
        }
        let meta = "Pročitaj priču prvo";
        if (passed) meta = "Položeno — priča se smije zamijeniti";
        else if (completed) meta = "5 pitanja · treba 4 točna";
        a.innerHTML = `
          <div class="icon">${passed ? "✅" : locked ? "🔒" : "📝"}</div>
          <div class="text">
            <div class="hr">${s.titleHr}</div>
            <div class="en">${s.titleEn}</div>
            <div class="meta">${meta}</div>
          </div>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          if (locked) return;
          history.pushState({ quiz: s.id }, "", `index.html?quiz=${s.id}`);
          startQuiz(s.id);
        });
        quizList.appendChild(a);
      });
    }

    function renderSongs() {
      songList.innerHTML = "";
      SONGS.forEach((s) => {
        const a = document.createElement("a");
        a.className = "story-card";
        a.href = `index.html?song=${s.id}`;
        a.innerHTML = `
          <div class="icon">🎸</div>
          <div class="text">
            <div class="hr">${s.title}</div>
            <div class="en">${s.artist}</div>
            <div class="meta">Key of ${s.key}${s.capo ? `, capo ${s.capo}` : ""}</div>
          </div>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState({ song: s.id }, "", `index.html?song=${s.id}`);
          selectSong(s.id);
        });
        songList.appendChild(a);
      });
    }

    function renderBooks() {
      bookList.innerHTML = "";
      BOOKS.forEach((b) => {
        const a = document.createElement("a");
        a.className = "story-card";
        a.href = `index.html?book=${b.id}`;
        a.innerHTML = `
          <div class="icon">${b.emoji}</div>
          <div class="text">
            <div class="hr">${b.titleEn}</div>
            <div class="en">${b.titleHr}</div>
            <div class="meta">${b.lines.length} redaka</div>
          </div>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState({ book: b.id }, "", `index.html?book=${b.id}`);
          selectBook(b.id);
        });
        bookList.appendChild(a);
      });
    }

    function selectSong(id) {
      song = SONGS.find((s) => s.id === id) || SONGS[0];
      songPreviewTitle.textContent = song.title;
      songPreviewMeta.textContent = `${song.artist} · Key of ${song.key}${song.capo ? `, capo ${song.capo}` : ""}`;
      songPreviewSections.innerHTML = song.sections
        .map((sec) => `
          <div class="song-section-row">
            <span class="song-section-label">${sec.label}</span>
            <span class="song-section-chords">${sec.chords.join(" · ")}</span>
          </div>
        `)
        .join("");
      showScreen(songPreviewScreen);
    }

    songPreviewBackLink.addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });

    // Builds the flat, continuously-scrolling column of every lyric line in
    // play order (instrumental sections contribute none, since their `lines`
    // array is empty), then measures each line's vertical position so the
    // scroll loop can look up "which section is at the read position" by
    // position instead of by a discrete line index.
    function renderKaraokeTrack() {
      karaokeTrack.innerHTML = "";
      karaokeLineOffsets = [];
      song.sections.forEach((section, si) => {
        section.lines.forEach((text) => {
          const div = document.createElement("div");
          div.className = "karaoke-line";
          div.textContent = text;
          karaokeTrack.appendChild(div);
          karaokeLineOffsets.push({ el: div, sectionIdx: si, top: 0 });
        });
      });
      measureKaraokeScroll();
    }

    // The section whose chords belong in the corner widget right now: the
    // last line whose top has scrolled up to (or past) the viewport's
    // vertical center, i.e. the line currently at the "read position".
    function currentSectionIdx() {
      if (karaokeLineOffsets.length === 0) return 0;
      const readPos = karaokeScrollPos() + karaokeViewport.clientHeight / 2;
      let current = karaokeLineOffsets[0];
      for (const entry of karaokeLineOffsets) {
        if (entry.top <= readPos) current = entry;
        else break;
      }
      return current.sectionIdx;
    }

    function updateChordWidget() {
      const section = song.sections[currentSectionIdx()];
      const label = `${section.label}: ${section.chords.join(" · ")}`;
      if (chordWidget.textContent !== label) chordWidget.textContent = label;
    }

    function karaokeFrame(now) {
      if (!karaokeLastFrameTime) karaokeLastFrameTime = now;
      const deltaSec = (now - karaokeLastFrameTime) / 1000;
      karaokeLastFrameTime = now;

      // Finger scroll owns the pane; auto-scroll resumes after release.
      if (!karaokeDragging) {
        let next = karaokePos + karaokeSpeed * deltaSec;
        if (karaokeMaxScroll > 0 && next >= karaokeMaxScroll) {
          next = 0; // looped back to the start
        }
        setKaraokeScrollPos(next);
      }

      karaokeRafId = requestAnimationFrame(karaokeFrame);
    }

    function startKaraokeScroll() {
      cancelAnimationFrame(karaokeRafId);
      karaokeLastFrameTime = 0;
      karaokeRafId = requestAnimationFrame(karaokeFrame);
    }

    function stopKaraokeScroll() {
      cancelAnimationFrame(karaokeRafId);
      karaokeRafId = null;
    }

    // Jumps the scroll position to the start of the next/previous section
    // that actually has lyric lines (wrapping at both ends), skipping
    // purely instrumental sections since there's nothing to scroll to there.
    function jumpToSection(direction) {
      const total = song.sections.length;
      let idx = currentSectionIdx();
      for (let i = 0; i < total; i++) {
        idx = direction === "forward" ? (idx + 1) % total : (idx - 1 + total) % total;
        const firstLine = karaokeLineOffsets.find((entry) => entry.sectionIdx === idx);
        if (firstLine) {
          setKaraokeScrollPos(Math.max(0, firstLine.top - karaokeViewport.clientHeight / 2));
          return;
        }
      }
    }

    function enterPerformance(pushHistory = true) {
      if (pushHistory) {
        history.pushState({ song: song.id, play: true }, "", `index.html?song=${song.id}&play=1`);
      }
      clearTimeout(karaokeResumeTimer);
      karaokeDragging = false;
      showScreen(songPlayScreen);
      renderKaraokeTrack();
      // Remeasure after the screen is shown and laid out — hidden screens
      // report a 0-height viewport, which would lock scrolling.
      requestAnimationFrame(() => {
        measureKaraokeScroll();
        setKaraokeScrollPos(0);
        setSongPaused(false);
      });
    }

    songPlayBtn.addEventListener("click", () => enterPerformance());

    // Native lyric-pane scrolling (finger or wheel). Auto-scroll yields for
    // the gesture + momentum, then resumes if the user hasn't hit pause.
    karaokeViewport.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      beginKaraokeDrag();
    });
    karaokeViewport.addEventListener("pointerup", scheduleKaraokeResume);
    karaokeViewport.addEventListener("pointercancel", scheduleKaraokeResume);
    karaokeViewport.addEventListener("scroll", () => {
      updateChordWidget();
      if (karaokeDragging) scheduleKaraokeResume();
    }, { passive: true });
    window.addEventListener("resize", () => {
      if (!songPlayScreen.hidden) measureKaraokeScroll();
    });

    document.getElementById("songPrevBtn").addEventListener("click", () => {
      jumpToSection("backward");
    });
    document.getElementById("songNextBtn").addEventListener("click", () => {
      jumpToSection("forward");
    });

    songPauseBtn.addEventListener("click", () => {
      setSongPaused(!songPaused);
    });

    document.getElementById("speedUpBtn").addEventListener("click", () => {
      karaokeSpeed = Math.min(KARAOKE_MAX_SPEED, karaokeSpeed + KARAOKE_SPEED_STEP);
      updateKaraokeSpeedLabel();
    });
    document.getElementById("speedDownBtn").addEventListener("click", () => {
      karaokeSpeed = Math.max(KARAOKE_MIN_SPEED, karaokeSpeed - KARAOKE_SPEED_STEP);
      updateKaraokeSpeedLabel();
    });
    updateKaraokeSpeedLabel();

    songPlayBackLink.addEventListener("click", (e) => {
      e.preventDefault();
      stopKaraokeScroll();
      history.back();
    });

    function showSection(section) {
      currentSection = section;
      storiesTabOption.classList.toggle("active", section === "stories");
      songsTabOption.classList.toggle("active", section === "songs");
      booksTabOption.classList.toggle("active", section === "books");
      quizTabOption.classList.toggle("active", section === "quiz");
      storyList.hidden = section !== "stories";
      songList.hidden = section !== "songs";
      bookList.hidden = section !== "books";
      quizList.hidden = section !== "quiz";
      if (section === "stories") {
        learnHint.hidden = false;
        learnHint.textContent = "Slušaj. U pauzi ponovi.";
      } else if (section === "quiz") {
        learnHint.hidden = false;
        learnHint.textContent = "Položi kviz. Tek onda ide nova priča.";
      } else {
        learnHint.hidden = true;
      }
    }

    storiesTabOption.addEventListener("click", () => showSection("stories"));
    songsTabOption.addEventListener("click", () => showSection("songs"));
    booksTabOption.addEventListener("click", () => showSection("books"));
    quizTabOption.addEventListener("click", () => {
      renderQuizList();
      showSection("quiz");
    });

    function showHome() {
      story = null;
      contentKind = null;
      song = null;
      quizStory = null;
      renderHome();
      renderQuizList();
      showScreen(homeScreen);
      showSection(currentSection);
    }

    function selectContent(id, list) {
      story = list.find((s) => s.id === id) || list[0];
      contentKind = list === BOOKS ? "book" : "story";
      idx = 0;
      doneScreen.hidden = true;
      playerTop.hidden = false;
      lineArea.hidden = false;
      controls.hidden = false;
      showScreen(playerScreen);
      renderCurrent();
    }

    function selectStory(id) {
      selectContent(id, displayedStories());
    }

    function selectBook(id) {
      selectContent(id, BOOKS);
    }

    function attemptPlay() {
      clearTimeout(pendingTimer);
      pendingAction = null;
      isPaused = false;
      pauseBtn.textContent = "⏸";
      pausedState = "playing";
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          replayBtn.textContent = "🔁 Ponovi";
        }).catch(() => {
          replayBtn.textContent = "▶ Reproduciraj";
        });
      } else {
        replayBtn.textContent = "🔁 Ponovi";
      }
    }

    function playCurrent() {
      const line = story.lines[idx];
      audio.src = line.audio;
      replayBtn.textContent = "🔁 Ponovi";
      attemptPlay();
    }

    function renderCurrent() {
      const line = story.lines[idx];
      lineHr.textContent = line.hr;
      lineEn.textContent = line.en;
      playCurrent();
    }

    // Shared by the manual prev/next buttons and the auto-advance timer, so both
    // agree on what "forward"/"backward" means. Each step is one 5–6 word phrase.
    function advance(direction) {
      if (direction === "forward") {
        if (idx < story.lines.length - 1) {
          idx++;
        } else {
          showDone();
          return;
        }
      } else if (idx > 0) {
        idx--;
      } else {
        return;
      }
      renderCurrent();
    }

    function showDone() {
      playerTop.hidden = true;
      lineArea.hidden = true;
      controls.hidden = true;
      doneScreen.querySelector(".line-hr").textContent = contentKind === "book" ? "Kraj knjige" : "Kraj priče";
      doneScreen.hidden = false;
      if (contentKind === "story") {
        markCompleted(story);
        doneQuizBtn.hidden = false;
        return;
      }
      doneQuizBtn.hidden = true;
      scheduleAdvance(2500, () => {
        history.pushState(null, "", "index.html");
        showHome();
      });
    }

    function startQuiz(id) {
      quizStory = displayedStories().find((s) => s.id === id);
      if (!quizStory) return;
      if (!canTakeQuiz(quizStory)) {
        currentSection = "quiz";
        showHome();
        return;
      }
      quizItems = buildQuiz(quizStory);
      quizIdx = 0;
      quizScore = 0;
      quizLocked = false;
      quizStatus.textContent = "";
      showScreen(quizScreen);
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const item = quizItems[quizIdx];
      quizProgress.textContent = `${quizIdx + 1} / ${quizItems.length}`;
      quizPromptLabel.textContent = item.type === "cloze" ? "Dopuni" : "Kako se kaže";
      quizPrompt.textContent = item.en;
      quizLocked = false;
      if (item.type === "tiles") {
        quizPlaced = [];
        quizBank = item.tiles.slice();
        renderQuizTiles();
      } else {
        renderTypedQuestion(item);
      }
    }

    function renderTypedQuestion(item) {
      quizChoices.innerHTML = "";
      const form = document.createElement("form");
      form.className = "quiz-type";
      if (item.hint) {
        const hint = document.createElement("div");
        hint.className = "quiz-hint";
        hint.textContent = item.hint;
        form.appendChild(hint);
      }
      const input = document.createElement("input");
      input.type = "text";
      input.className = "quiz-input";
      input.lang = "hr";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      const check = document.createElement("button");
      check.type = "submit";
      check.className = "quiz-check";
      check.textContent = "Provjeri";
      form.append(input, check);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        onTypedCheck(item, input, check);
      });
      quizChoices.appendChild(form);
      input.focus();
    }

    function onTypedCheck(item, input, check) {
      if (quizLocked || !input.value.trim()) return;
      quizLocked = true;
      input.disabled = true;
      check.disabled = true;
      const result = checkTyped(input.value, item.correct);
      if (result.ok) quizScore += 1;
      input.classList.add(result.ok ? "correct" : "wrong");
      if (!result.ok) quizStatus.textContent = item.correct;
      else if (!result.exact) quizStatus.textContent = `točno, ali: ${item.correct}`;
      nextQuizQuestion(result.ok && result.exact ? 700 : 2400);
    }

    // On anything short of a clean hit, the real answer is on screen, so hold
    // long enough to read it.
    function nextQuizQuestion(delayMs) {
      setTimeout(() => {
        quizStatus.textContent = "";
        if (quizIdx < quizItems.length - 1) {
          quizIdx += 1;
          renderQuizQuestion();
        } else {
          finishQuiz();
        }
      }, delayMs);
    }

    function quizTileButton(tile, where) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quiz-tile";
      btn.textContent = tile.text;
      btn.disabled = quizLocked;
      btn.addEventListener("click", () => {
        if (quizLocked) return;
        if (where === "bank") {
          quizBank = quizBank.filter((t) => t.id !== tile.id);
          quizPlaced.push(tile);
        } else {
          quizPlaced = quizPlaced.filter((t) => t.id !== tile.id);
          quizBank.push(tile);
        }
        renderQuizTiles();
      });
      return btn;
    }

    // Redrawn on every tap: the answer row on top, the unused tiles below.
    // Tapping a placed tile sends it back, so a wrong guess stays undoable
    // right up until "Provjeri".
    function renderQuizTiles() {
      const item = quizItems[quizIdx];
      quizChoices.innerHTML = "";

      const build = document.createElement("div");
      build.className = "quiz-build";
      if (quizPlaced.length === 0) {
        const hint = document.createElement("span");
        hint.className = "quiz-build-hint";
        hint.textContent = "Složi rečenicu";
        build.appendChild(hint);
      }
      quizPlaced.forEach((tile) => build.appendChild(quizTileButton(tile, "placed")));
      quizChoices.appendChild(build);

      const bank = document.createElement("div");
      bank.className = "quiz-bank";
      quizBank.forEach((tile) => bank.appendChild(quizTileButton(tile, "bank")));
      quizChoices.appendChild(bank);

      const check = document.createElement("button");
      check.type = "button";
      check.className = "quiz-check";
      check.textContent = "Provjeri";
      check.disabled = quizLocked || quizPlaced.length === 0;
      check.addEventListener("click", () => onQuizCheck(item));
      quizChoices.appendChild(check);
    }

    function onQuizCheck(item) {
      if (quizLocked) return;
      quizLocked = true;
      const right = quizPlaced.map((t) => t.text).join(" ") === item.correct;
      if (right) quizScore += 1;
      renderQuizTiles();
      quizChoices.querySelector(".quiz-build").classList.add(right ? "correct" : "wrong");
      if (!right) quizStatus.textContent = item.correct;
      nextQuizQuestion(right ? 700 : 2400);
    }

    function finishQuiz() {
      const passed = quizScore >= QUIZ_PASS;
      quizChoices.innerHTML = "";
      quizPrompt.textContent = passed ? "Položeno" : "Još jednom";
      quizProgress.textContent = `${quizScore} / ${quizItems.length}`;
      if (passed) {
        markPassed(quizStory);
        quizStatus.textContent = "Ova se priča smije zamijeniti idući tjedan.";
      } else {
        quizStatus.textContent = "Treba 4 točna. Priča ostaje do sljedećeg pokušaja.";
      }
      const again = document.createElement("button");
      again.type = "button";
      again.className = "replay";
      again.textContent = passed ? "Natrag" : "Pokušaj opet";
      again.addEventListener("click", () => {
        if (passed) {
          history.pushState(null, "", "index.html");
          renderHome();
          renderQuizList();
          showHome();
          showSection("quiz");
        } else {
          startQuiz(quizStory.id);
        }
      });
      quizChoices.appendChild(again);
    }

    doneQuizBtn.addEventListener("click", () => {
      history.pushState({ quiz: story.id }, "", `index.html?quiz=${story.id}`);
      startQuiz(story.id);
    });
    quizBackLink.addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });

    // Schedules the next step and remembers it as `pendingAction`, so that if the
    // user pauses during this gap, unpausing can run the exact same action
    // immediately instead of guessing what it was.
    function scheduleAdvance(pauseMs, action) {
      pendingAction = action;
      pausedState = "waiting";
      pendingTimer = setTimeout(() => {
        pendingAction = null;
        action();
      }, pauseMs);
    }

    audio.addEventListener("ended", () => {
      const spokenSeconds = audio.duration || 2;
      scheduleAdvance(spokenSeconds * PHRASE_PAUSE_MULT * 1000, () => advance("forward"));
    });

    // If the audio file 404s or otherwise fails to load, "ended" never fires and
    // playback would hang forever. Treat a load failure like a normal-speed
    // "ended" - a short fixed pause (in place of the missing clip's duration),
    // then advance - so the reader never gets stuck.
    audio.addEventListener("error", () => {
      scheduleAdvance(PHRASE_PAUSE_MULT * 1000, () => advance("forward"));
    });

    document.getElementById("prevBtn").addEventListener("click", () => advance("backward"));
    document.getElementById("nextBtn").addEventListener("click", () => advance("forward"));
    replayBtn.addEventListener("click", attemptPlay);

    pauseBtn.addEventListener("click", () => {
      if (!isPaused) {
        isPaused = true;
        pauseBtn.textContent = "▶";
        if (pausedState === "playing") {
          audio.pause();
        } else if (pausedState === "waiting") {
          clearTimeout(pendingTimer);
        }
        return;
      }
      isPaused = false;
      pauseBtn.textContent = "⏸";
      if (pausedState === "playing") {
        audio.play();
      } else if (pausedState === "waiting" && pendingAction) {
        const action = pendingAction;
        pendingAction = null;
        action();
      }
    });

    backLink.addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });

    // Reci: speak first, then hear it. The English line is shown, you say the
    // Croatian into the silence, the clip confirms it, and you rate yourself.
    // A miss goes to the back of the queue; the session ends when every line
    // is Znam. Nothing is stored - it is a drill, not a schedule.
    const reciScreen = document.getElementById("reciScreen");
    const reciLabel = document.getElementById("reciLabel");
    const reciEn = document.getElementById("reciEn");
    const reciHr = document.getElementById("reciHr");
    const reciActions = document.getElementById("reciActions");
    const reciProgress = document.getElementById("reciProgress");
    // Its own element, so the story player's "ended" auto-advance never fires
    // underneath a drill.
    const reciAudio = new Audio();
    reciAudio.preload = "auto";
    let reciStory = null;
    let reciQueue = [];
    let reciDone = 0;
    let reciTimer = null;
    let reciToken = 0; // bumped per line, so a late timer or metadata event from the previous line is ignored
    let reciRevealed = false;

    function reciButton(label, className, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = className;
      btn.textContent = label;
      btn.addEventListener("click", onClick);
      reciActions.appendChild(btn);
      return btn;
    }

    function stopReci() {
      clearTimeout(reciTimer);
      reciToken += 1;
      reciAudio.pause();
    }

    function startReci(id) {
      reciStory = displayedStories().find((s) => s.id === id);
      if (!reciStory) {
        showHome();
        return;
      }
      showScreen(reciScreen);
      // iOS only lets this element play later, from a timer, if it has already
      // been started inside a tap - so start and immediately stop it here.
      reciAudio.src = reciStory.lines[0].audio;
      const unlock = reciAudio.play();
      if (unlock && unlock.catch) unlock.catch(() => {});
      reciAudio.pause();
      reciQueue = shuffle(reciStory.lines);
      reciDone = 0;
      nextReci();
    }

    function nextReci() {
      stopReci();
      const total = reciStory.lines.length;
      reciProgress.textContent = `${reciDone} / ${total}`;
      reciActions.innerHTML = "";
      reciHr.hidden = true;

      if (!reciQueue.length) {
        reciLabel.textContent = "Gotovo";
        reciEn.textContent = "Sve rečenice znaš.";
        reciButton("Opet", "quiz-check", () => startReci(reciStory.id));
        return;
      }

      const line = reciQueue[0];
      const token = reciToken;
      reciRevealed = false;
      reciLabel.textContent = "Reci na hrvatskom";
      reciEn.textContent = line.en;
      reciHr.textContent = line.hr;
      reciButton("Pokaži", "quiz-check", () => revealReci(token));

      // The silence to answer in is twice the clip - the same room the story
      // player gives - with a fallback in case the clip never loads.
      reciAudio.src = line.audio;
      reciTimer = setTimeout(() => revealReci(token), 5000);
      reciAudio.addEventListener("loadedmetadata", () => {
        if (token !== reciToken || reciRevealed || !reciAudio.duration) return;
        clearTimeout(reciTimer);
        reciTimer = setTimeout(() => revealReci(token), reciAudio.duration * PHRASE_PAUSE_MULT * 1000);
      }, { once: true });
    }

    function revealReci(token) {
      if (token !== reciToken || reciRevealed) return;
      reciRevealed = true;
      clearTimeout(reciTimer);
      reciHr.hidden = false;
      reciAudio.currentTime = 0;
      const p = reciAudio.play();
      if (p && p.catch) p.catch(() => {});
      reciActions.innerHTML = "";
      reciButton("🔁", "quiz-check reci-no", () => {
        reciAudio.currentTime = 0;
        const again = reciAudio.play();
        if (again && again.catch) again.catch(() => {});
      });
      reciButton("Ne znam", "quiz-check reci-no", () => {
        reciQueue.push(reciQueue.shift());
        nextReci();
      });
      reciButton("Znam", "quiz-check", () => {
        reciQueue.shift();
        reciDone += 1;
        nextReci();
      });
    }

    document.getElementById("reciBtn").addEventListener("click", () => {
      history.pushState({ reci: story.id }, "", `index.html?reci=${story.id}`);
      startReci(story.id);
    });
    document.getElementById("reciBackLink").addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });

    function syncFromUrl() {
      const params = new URLSearchParams(location.search);
      const storyId = params.get("story");
      const songId = params.get("song");
      const bookId = params.get("book");
      const quizId = params.get("quiz");
      const reciId = params.get("reci");
      if (storyId && displayedStories().some((s) => s.id === storyId)) {
        selectStory(storyId);
      } else if (reciId && displayedStories().some((s) => s.id === reciId)) {
        startReci(reciId);
      } else if (quizId && displayedStories().some((s) => s.id === quizId)) {
        startQuiz(quizId);
      } else if (songId && SONGS.some((s) => s.id === songId)) {
        selectSong(songId);
        if (params.get("play")) enterPerformance(false);
      } else if (bookId && BOOKS.some((b) => b.id === bookId)) {
        selectBook(bookId);
      } else {
        showHome();
      }
    }
    window.addEventListener("popstate", syncFromUrl);

    const homeEyebrow = document.getElementById("homeEyebrow");
    if (typeof STORY_DATE_HR === "string" && STORY_DATE_HR) {
      homeEyebrow.textContent = `✨ Nikola · ${STORY_DATE_HR}`;
    }

    renderHome();
    renderSongs();
    renderBooks();
    renderQuizList();
    syncFromUrl();

    // Keep the screen awake for the duration of the story.
    let wakeLock = null;
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) {
        // ignore - not critical to playback
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
  </script>
</body>
</html>

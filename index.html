<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Vrijeme za priču</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="oklch(16% 0.012 55)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="home" id="homeScreen">
    <div class="eyebrow">✨ Vrijeme za priču</div>
    <h1 id="homeHeading">📖 Priče</h1>
    <div class="speed-toggle-group" id="sectionTabs">
      <div id="storiesTabOption" class="speed-option active">Priče</div>
      <div id="songsTabOption" class="speed-option">Pjesme</div>
      <div id="booksTabOption" class="speed-option">Knjige</div>
    </div>
    <div class="story-list" id="storyList"></div>
    <div class="story-list" id="songList" hidden></div>
    <div class="story-list" id="bookList" hidden></div>
  </div>

  <div class="player" id="playerScreen" hidden>
    <div class="player-top" id="playerTop">
      <a class="back-link" href="index.html" id="backLink">&lsaquo; Natrag</a>
      <div class="speed-toggle-group">
        <div id="normalOption" class="speed-option active">Normalno</div>
        <div id="slowOption" class="speed-option">Polako</div>
      </div>
    </div>

    <div class="line-area" id="lineArea">
      <div class="line-hr" id="lineHr"></div>
      <div class="line-en" id="lineEn"></div>
    </div>

    <div class="controls" id="controls">
      <button id="prevBtn" class="icon-btn" aria-label="Prethodno">&lsaquo;</button>
      <button id="replayBtn" class="replay">&#128257; Ponovi</button>
      <button id="pauseBtn" class="icon-btn" aria-label="Pauza">&#9208;</button>
      <button id="nextBtn" class="icon-btn" aria-label="Sljedeće">&rsaquo;</button>
    </div>

    <div class="done" id="doneScreen" hidden>
      <div class="line-hr">Kraj priče</div>
      <div class="line-en">The end</div>
    </div>
  </div>

  <div class="player" id="songPreviewScreen" hidden>
    <div class="player-top">
      <a class="back-link" href="index.html" id="songPreviewBackLink">&lsaquo; Natrag</a>
    </div>
    <div class="song-preview-body">
      <div class="eyebrow" id="songPreviewArtist"></div>
      <h1 id="songPreviewTitle"></h1>
      <div class="song-preview-meta" id="songPreviewMeta"></div>
      <div class="song-preview-sections" id="songPreviewSections"></div>
      <button id="songPlayBtn" class="replay">🎸 Sviraj</button>
    </div>
  </div>

  <div class="player" id="songPlayScreen" hidden>
    <div class="chord-widget" id="chordWidget"></div>
    <div class="player-top">
      <a class="back-link" href="index.html" id="songPlayBackLink">&lsaquo; Natrag</a>
    </div>
    <div class="line-area" id="songLineArea">
      <div class="line-hr" id="songLineText"></div>
    </div>
    <div class="controls" id="songControls">
      <button id="songPrevBtn" class="icon-btn" aria-label="Prethodni dio">&lsaquo;</button>
      <button id="speedDownBtn" class="icon-btn" aria-label="Sporije">&minus;</button>
      <button id="songPauseBtn" class="icon-btn" aria-label="Pauza">&#9208;</button>
      <button id="speedUpBtn" class="icon-btn" aria-label="Brže">&plus;</button>
      <button id="songNextBtn" class="icon-btn" aria-label="Sljedeći dio">&rsaquo;</button>
    </div>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script src="stories.js"></script>
  <script src="songs.js"></script>
  <script src="books.js"></script>
  <script>
    const homeScreen = document.getElementById("homeScreen");
    const playerScreen = document.getElementById("playerScreen");
    const storyList = document.getElementById("storyList");
    const playerTop = document.getElementById("playerTop");
    const lineArea = document.getElementById("lineArea");
    const controls = document.getElementById("controls");
    const doneScreen = document.getElementById("doneScreen");
    const backLink = document.getElementById("backLink");
    const audio = document.getElementById("audio");
    const lineHr = document.getElementById("lineHr");
    const lineEn = document.getElementById("lineEn");
    const replayBtn = document.getElementById("replayBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const normalOption = document.getElementById("normalOption");
    const slowOption = document.getElementById("slowOption");
    const homeHeading = document.getElementById("homeHeading");
    const songList = document.getElementById("songList");
    const bookList = document.getElementById("bookList");
    const storiesTabOption = document.getElementById("storiesTabOption");
    const songsTabOption = document.getElementById("songsTabOption");
    const booksTabOption = document.getElementById("booksTabOption");
    const songPreviewScreen = document.getElementById("songPreviewScreen");
    const songPreviewArtist = document.getElementById("songPreviewArtist");
    const songPreviewTitle = document.getElementById("songPreviewTitle");
    const songPreviewMeta = document.getElementById("songPreviewMeta");
    const songPreviewSections = document.getElementById("songPreviewSections");
    const songPreviewBackLink = document.getElementById("songPreviewBackLink");
    const songPlayBtn = document.getElementById("songPlayBtn");
    const songPlayScreen = document.getElementById("songPlayScreen");
    const chordWidget = document.getElementById("chordWidget");
    const songLineText = document.getElementById("songLineText");
    const songPauseBtn = document.getElementById("songPauseBtn");
    const songPlayBackLink = document.getElementById("songPlayBackLink");

    let story = null; // the current STORIES or BOOKS entry being read - same shape either way
    let contentKind = null; // "story" | "book" - which list `story` came from
    let song = null;
    let idx = 0;
    let slowMode = false;
    let playingHalf = "a"; // which half is loaded when slowMode is on: "a" or "b"
    let repeat = 1; // which play-through (1 or 2) of the current half, slow mode only
    let pendingTimer = null; // the scheduled auto-advance/half-flip/return-home timeout, if any
    let pendingAction = null; // what pendingTimer will do when it fires - resumed immediately on unpause
    let isPaused = false;
    let pausedState = null; // "playing" | "waiting" - what we were doing when paused
    const SLOW_PAUSE_MULT = 1; // pause after each half, in slow mode
    const NORMAL_PAUSE_MULT = 1.5; // pause after the full line, in normal mode

    let sectionIdx = 0;
    let lineIdx = 0;
    let songTimer = null;
    let songPaused = false;
    let scrollIntervalMs = 4000;
    const MIN_INTERVAL_MS = 1500;
    const MAX_INTERVAL_MS = 10000;

    // Shared by every screen transition so exactly one of the 4 top-level
    // screens is ever visible, and any pending Story/Song timer or playing
    // audio from the screen we're leaving is stopped.
    function showScreen(el) {
      clearTimeout(pendingTimer);
      clearTimeout(songTimer);
      audio.pause();
      [homeScreen, playerScreen, songPreviewScreen, songPlayScreen].forEach((s) => {
        s.hidden = s !== el;
      });
    }

    function renderHome() {
      storyList.innerHTML = "";
      STORIES.forEach((s) => {
        const a = document.createElement("a");
        a.className = "story-card";
        a.href = `index.html?story=${s.id}`;
        a.innerHTML = `
          <div class="icon">${s.emoji}</div>
          <div class="text">
            <div class="hr">${s.titleHr}</div>
            <div class="en">${s.titleEn}</div>
            <div class="meta">${s.lines.length} redaka</div>
          </div>
        `;
        // Handled with a same-page view switch (not a real navigation) so this
        // click's user gesture is still active when we call audio.play() below -
        // a fresh page load loses that gesture and iOS Safari blocks autoplay.
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState({ story: s.id }, "", `index.html?story=${s.id}`);
          selectStory(s.id);
        });
        storyList.appendChild(a);
      });
    }

    function renderSongs() {
      songList.innerHTML = "";
      SONGS.forEach((s) => {
        const a = document.createElement("a");
        a.className = "story-card";
        a.href = `index.html?song=${s.id}`;
        a.innerHTML = `
          <div class="icon">🎸</div>
          <div class="text">
            <div class="hr">${s.title}</div>
            <div class="en">${s.artist}</div>
            <div class="meta">Key of ${s.key}${s.capo ? `, capo ${s.capo}` : ""}</div>
          </div>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState({ song: s.id }, "", `index.html?song=${s.id}`);
          selectSong(s.id);
        });
        songList.appendChild(a);
      });
    }

    function renderBooks() {
      bookList.innerHTML = "";
      BOOKS.forEach((b) => {
        const a = document.createElement("a");
        a.className = "story-card";
        a.href = `index.html?book=${b.id}`;
        a.innerHTML = `
          <div class="icon">${b.emoji}</div>
          <div class="text">
            <div class="hr">${b.titleHr}</div>
            <div class="en">${b.titleEn}</div>
            <div class="meta">${b.lines.length} redaka</div>
          </div>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState({ book: b.id }, "", `index.html?book=${b.id}`);
          selectBook(b.id);
        });
        bookList.appendChild(a);
      });
    }

    function selectSong(id) {
      song = SONGS.find((s) => s.id === id) || SONGS[0];
      songPreviewArtist.textContent = song.artist;
      songPreviewTitle.textContent = song.title;
      songPreviewMeta.textContent = `Key of ${song.key}${song.capo ? `, capo ${song.capo}` : ""}`;
      songPreviewSections.innerHTML = song.sections
        .map((sec) => `
          <div class="song-section-row">
            <div class="song-section-label">${sec.label}</div>
            <div class="song-section-chords">${sec.chords.join(" · ")}</div>
          </div>
        `)
        .join("");
      showScreen(songPreviewScreen);
    }

    songPreviewBackLink.addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });

    function currentSongLines() {
      const section = song.sections[sectionIdx];
      return section.lines.length > 0 ? section.lines : [""];
    }

    function renderSongLine() {
      const section = song.sections[sectionIdx];
      chordWidget.textContent = `${section.label}: ${section.chords.join(" · ")}`;
      songLineText.textContent = currentSongLines()[lineIdx];
    }

    function scheduleSongAdvance() {
      clearTimeout(songTimer);
      songTimer = setTimeout(() => advanceSongLine("forward"), scrollIntervalMs);
    }

    function advanceSongLine(direction) {
      const lines = currentSongLines();
      if (direction === "forward") {
        if (lineIdx < lines.length - 1) {
          lineIdx++;
        } else if (sectionIdx < song.sections.length - 1) {
          sectionIdx++;
          lineIdx = 0;
        } else {
          sectionIdx = 0;
          lineIdx = 0;
        }
      } else {
        if (lineIdx > 0) {
          lineIdx--;
        } else if (sectionIdx > 0) {
          sectionIdx--;
          lineIdx = currentSongLines().length - 1;
        }
      }
      renderSongLine();
      if (!songPaused) scheduleSongAdvance();
    }

    // Jumps a whole section at a time (wrapping at both ends), unlike
    // advanceSongLine above which steps one lyric line at a time. Used by the
    // prev/next buttons, since every section's chords only change at section
    // boundaries and lines are currently blank placeholders.
    function advanceSongSection(direction) {
      clearTimeout(songTimer);
      if (direction === "forward") {
        sectionIdx = sectionIdx < song.sections.length - 1 ? sectionIdx + 1 : 0;
      } else {
        sectionIdx = sectionIdx > 0 ? sectionIdx - 1 : song.sections.length - 1;
      }
      lineIdx = 0;
      renderSongLine();
      if (!songPaused) scheduleSongAdvance();
    }

    function enterPerformance(pushHistory = true) {
      if (pushHistory) {
        history.pushState({ song: song.id, play: true }, "", `index.html?song=${song.id}&play=1`);
      }
      sectionIdx = 0;
      lineIdx = 0;
      songPaused = false;
      songPauseBtn.textContent = "⏸";
      showScreen(songPlayScreen);
      renderSongLine();
      scheduleSongAdvance();
    }

    songPlayBtn.addEventListener("click", () => enterPerformance());

    document.getElementById("songPrevBtn").addEventListener("click", () => {
      advanceSongSection("backward");
    });
    document.getElementById("songNextBtn").addEventListener("click", () => {
      advanceSongSection("forward");
    });

    songPauseBtn.addEventListener("click", () => {
      songPaused = !songPaused;
      songPauseBtn.textContent = songPaused ? "▶" : "⏸";
      if (songPaused) {
        clearTimeout(songTimer);
      } else {
        scheduleSongAdvance();
      }
    });

    document.getElementById("speedUpBtn").addEventListener("click", () => {
      scrollIntervalMs = Math.max(MIN_INTERVAL_MS, scrollIntervalMs - 500);
    });
    document.getElementById("speedDownBtn").addEventListener("click", () => {
      scrollIntervalMs = Math.min(MAX_INTERVAL_MS, scrollIntervalMs + 500);
    });

    songPlayBackLink.addEventListener("click", (e) => {
      e.preventDefault();
      clearTimeout(songTimer);
      history.back();
    });

    function showSection(section) {
      storiesTabOption.classList.toggle("active", section === "stories");
      songsTabOption.classList.toggle("active", section === "songs");
      booksTabOption.classList.toggle("active", section === "books");
      storyList.hidden = section !== "stories";
      songList.hidden = section !== "songs";
      bookList.hidden = section !== "books";
      homeHeading.textContent =
        section === "songs" ? "🎸 Pjesme" : section === "books" ? "📚 Knjige" : "📖 Priče";
    }

    storiesTabOption.addEventListener("click", () => showSection("stories"));
    songsTabOption.addEventListener("click", () => showSection("songs"));
    booksTabOption.addEventListener("click", () => showSection("books"));

    function showHome() {
      story = null;
      contentKind = null;
      song = null;
      showScreen(homeScreen);
    }

    function selectStory(id) {
      story = STORIES.find((s) => s.id === id) || STORIES[0];
      contentKind = "story";
      idx = 0;
      slowMode = false;
      playingHalf = "a";
      repeat = 1;
      normalOption.classList.add("active");
      slowOption.classList.remove("active");
      doneScreen.hidden = true;
      playerTop.hidden = false;
      lineArea.hidden = false;
      controls.hidden = false;
      showScreen(playerScreen);
      renderCurrent();
    }

    function selectBook(id) {
      story = BOOKS.find((b) => b.id === id) || BOOKS[0];
      contentKind = "book";
      idx = 0;
      slowMode = false;
      playingHalf = "a";
      repeat = 1;
      normalOption.classList.add("active");
      slowOption.classList.remove("active");
      doneScreen.hidden = true;
      playerTop.hidden = false;
      lineArea.hidden = false;
      controls.hidden = false;
      showScreen(playerScreen);
      renderCurrent();
    }

    function attemptPlay() {
      clearTimeout(pendingTimer);
      pendingAction = null;
      isPaused = false;
      pauseBtn.textContent = "⏸";
      pausedState = "playing";
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          replayBtn.textContent = "🔁 Ponovi";
        }).catch(() => {
          replayBtn.textContent = "▶ Reproduciraj";
        });
      } else {
        replayBtn.textContent = "🔁 Ponovi";
      }
    }

    function playCurrent() {
      const line = story.lines[idx];
      audio.src = slowMode ? (playingHalf === "a" ? line.audioSlowA : line.audioSlowB) : line.audio;
      replayBtn.textContent = "🔁 Ponovi";
      attemptPlay();
    }

    function renderCurrent() {
      const line = story.lines[idx];
      lineHr.textContent = line.hr;
      lineEn.textContent = line.en;
      playCurrent();
    }

    // Shared by the manual prev/next buttons and the auto-advance timer, so both
    // agree on what "forward"/"backward" means. In slow mode this steps through
    // segments (half A, half B) rather than whole lines - e.g. from half B,
    // backward lands on half A of the *same* line, not the previous line.
    function advance(direction) {
      if (direction === "forward") {
        if (slowMode) {
          if (playingHalf === "a") {
            playingHalf = "b";
          } else if (idx < story.lines.length - 1) {
            idx++;
            playingHalf = "a";
          } else {
            showDone();
            return;
          }
        } else if (idx < story.lines.length - 1) {
          idx++;
        } else {
          showDone();
          return;
        }
      } else {
        if (slowMode) {
          if (playingHalf === "b") {
            playingHalf = "a";
          } else if (idx > 0) {
            idx--;
            playingHalf = "b";
          } else {
            return;
          }
        } else if (idx > 0) {
          idx--;
        } else {
          return;
        }
      }
      repeat = 1;
      renderCurrent();
    }

    function showDone() {
      playerTop.hidden = true;
      lineArea.hidden = true;
      controls.hidden = true;
      doneScreen.querySelector(".line-hr").textContent = contentKind === "book" ? "Kraj knjige" : "Kraj priče";
      doneScreen.hidden = false;
      scheduleAdvance(2500, () => {
        history.pushState(null, "", "index.html");
        showHome();
      });
    }

    // Schedules the next step and remembers it as `pendingAction`, so that if the
    // user pauses during this gap, unpausing can run the exact same action
    // immediately instead of guessing what it was.
    function scheduleAdvance(pauseMs, action) {
      pendingAction = action;
      pausedState = "waiting";
      pendingTimer = setTimeout(() => {
        pendingAction = null;
        action();
      }, pauseMs);
    }

    audio.addEventListener("ended", () => {
      const spokenSeconds = audio.duration || 2;

      if (slowMode && repeat === 1) {
        scheduleAdvance(spokenSeconds * SLOW_PAUSE_MULT * 1000, () => {
          repeat = 2;
          playCurrent();
        });
        return;
      }

      const pauseMultiplier = slowMode ? SLOW_PAUSE_MULT : NORMAL_PAUSE_MULT;
      scheduleAdvance(spokenSeconds * pauseMultiplier * 1000, () => advance("forward"));
    });

    document.getElementById("prevBtn").addEventListener("click", () => advance("backward"));
    document.getElementById("nextBtn").addEventListener("click", () => advance("forward"));
    replayBtn.addEventListener("click", attemptPlay);

    pauseBtn.addEventListener("click", () => {
      if (!isPaused) {
        isPaused = true;
        pauseBtn.textContent = "▶";
        if (pausedState === "playing") {
          audio.pause();
        } else if (pausedState === "waiting") {
          clearTimeout(pendingTimer);
        }
        return;
      }
      isPaused = false;
      pauseBtn.textContent = "⏸";
      if (pausedState === "playing") {
        audio.play();
      } else if (pausedState === "waiting" && pendingAction) {
        const action = pendingAction;
        pendingAction = null;
        action();
      }
    });

    function setSlowMode(slow) {
      if (slow === slowMode) return;
      slowMode = slow;
      playingHalf = "a";
      repeat = 1;
      normalOption.classList.toggle("active", !slowMode);
      slowOption.classList.toggle("active", slowMode);
      renderCurrent();
    }
    normalOption.addEventListener("click", () => setSlowMode(false));
    slowOption.addEventListener("click", () => setSlowMode(true));

    backLink.addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });

    function syncFromUrl() {
      const params = new URLSearchParams(location.search);
      const storyId = params.get("story");
      const songId = params.get("song");
      const bookId = params.get("book");
      if (storyId && STORIES.some((s) => s.id === storyId)) {
        selectStory(storyId);
      } else if (songId && SONGS.some((s) => s.id === songId)) {
        selectSong(songId);
        if (params.get("play")) enterPerformance(false);
      } else if (bookId && BOOKS.some((b) => b.id === bookId)) {
        selectBook(bookId);
      } else {
        showHome();
      }
    }
    window.addEventListener("popstate", syncFromUrl);

    renderHome();
    renderSongs();
    renderBooks();
    syncFromUrl();

    // Keep the screen awake for the duration of the story.
    let wakeLock = null;
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) {
        // ignore - not critical to playback
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Vrijeme za priču</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#12141c" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="home">
    <h1>Vrijeme za priču</h1>
    <div class="story-list" id="storyList"></div>
  </div>

  <script src="stories.js"></script>
  <script>
    const list = document.getElementById("storyList");
    STORIES.forEach((story) => {
      const a = document.createElement("a");
      a.className = "story-card";
      a.href = `player.html?story=${story.id}`;
      a.innerHTML = `
        <div class="hr">${story.titleHr}</div>
        <div class="en">${story.titleEn}</div>
      `;
      list.appendChild(a);
    });
  </script>
</body>
</html>

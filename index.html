<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Vrijeme za priču</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="oklch(16% 0.012 55)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="home">
    <div class="eyebrow">✨ Vrijeme za priču</div>
    <h1>📖 Priče</h1>
    <div class="story-list" id="storyList"></div>
  </div>

  <script src="stories.js"></script>
  <script>
    const list = document.getElementById("storyList");
    STORIES.forEach((story) => {
      const a = document.createElement("a");
      a.className = "story-card";
      a.href = `player.html?story=${story.id}`;
      a.innerHTML = `
        <div class="icon">${story.emoji}</div>
        <div class="text">
          <div class="hr">${story.titleHr}</div>
          <div class="en">${story.titleEn}</div>
          <div class="meta">${story.lines.length} redaka</div>
        </div>
      `;
      list.appendChild(a);
    });
  </script>
</body>
</html>
